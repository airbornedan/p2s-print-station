<VirtualHost *:443>
    ServerName print.example.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/print.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/print.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Print-Remote
    RequestHeader unset Forwarded
    <Location />
        Require all denied
    </Location>
    <LocationMatch "^/(?:$|sw\.js|static/(?:app\.js|style\.css|manifest\.webmanifest|icon\.png|icon-512\.png)|api/(?:session|status|camera-health|enroll|logout|push(?:/(?:subscribe|unsubscribe|test))?|notifications/(?:latest|[a-f0-9]{32}(?:/photo)?)|viewer(?:/[A-Za-z0-9_-]+/(?:renew|release))?|camera/[A-Za-z0-9_-]+))$">
        Require all granted
        <LimitExcept GET HEAD POST>
            Require all denied
        </LimitExcept>
    </LocationMatch>
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=3 timeout=30 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8080/
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/print-mobile-error.log
    CustomLog ${APACHE_LOG_DIR}/print-mobile-access.log combined
</VirtualHost>
