# Append at the end of sshd_config, after existing Match blocks.
Match User printer-mobile
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:8080
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    MaxSessions 0
    ForceCommand /usr/sbin/nologin
