<VirtualHost *:80>
    ServerName print.example.com
    DocumentRoot /var/www/print-station-acme
    <Directory /var/www/print-station-acme>
        AllowOverride None
        Options None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://print.example.com%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/print-mobile-error.log
    CustomLog ${APACHE_LOG_DIR}/print-mobile-access.log combined
</VirtualHost>
